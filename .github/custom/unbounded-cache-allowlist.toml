# Allowlist for unbounded cache detection (v2).
#
# Each entry suppresses a FAIL or WARN for a struct field that uses
# HashMap/BTreeMap/HashSet/BTreeSet without detected pruning logic.
# Pruning may happen externally, via local variable alias, or the
# collection may be bounded by design.

[[allowed]]
entry = "beacon_node/beacon_chain/src/beacon_fork_choice_store.rs::BeaconForkChoiceStore::equivocating_indices"
reason = "Bounded by validator set size, pruned on finalization"

[[allowed]]
entry = "beacon_node/beacon_chain/src/beacon_fork_choice_store.rs::PersistedForkChoiceStore::equivocating_indices"
reason = "Serialization counterpart of BeaconForkChoiceStore, same bounds"

[[allowed]]
entry = "beacon_node/beacon_chain/src/observed_aggregates.rs::SlotHashSet::map"
reason = "Pruned externally by ObservedAggregates which removes old slots"

[[allowed]]
entry = "beacon_node/beacon_chain/src/observed_attesters.rs::EpochHashSet::set"
reason = "Pruned externally by AutoPruningEpochContainer"

[[allowed]]
entry = "beacon_node/beacon_chain/src/observed_attesters.rs::SyncAggregatorSlotHashSet::set"
