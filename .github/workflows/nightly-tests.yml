name: Test nightly failure reporting

on:
  workflow_dispatch:
    inputs:
      result:
        type: choice
        options: [failure, success]
        default: failure

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  beacon-chain-tests:
    needs: setup-matrix
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST_RESULT: ${{ inputs.result }}
        run: |
          if [ "$TEST_RESULT" = failure ]; then
            echo 'Deliberate failure to test issue reporting'
            exit 1
          fi

  op-pool-tests:
    needs: setup-matrix
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  network-tests:
    needs: setup-matrix
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  report-failure:
    needs: [setup-matrix, beacon-chain-tests, op-pool-tests, network-tests]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report nightly test failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly tests are failing'
          issue=$(gh issue list --state open --author 'github-actions[bot]' \
            --search "in:title \"$title\"" --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Nightly tests failed: $RUN_URL"
          else
            gh issue create --title "$title" --body "Nightly tests failed: $RUN_URL"
          fi
